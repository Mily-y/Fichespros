<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Fond avec dégradé -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f7dff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="book" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fond arrondi -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bg)" />

  <!-- Livre principal -->
  <rect x="110" y="130" width="140" height="240" rx="12" fill="url(#book)" />
  <rect x="110" y="130" width="140" height="240" rx="12" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3" />

  <!-- Reliure livre gauche -->
  <rect x="106" y="130" width="12" height="240" rx="4" fill="rgba(0,0,0,0.15)" />

  <!-- Lignes texte livre gauche -->
  <rect x="135" y="175" width="90" height="8" rx="4" fill="rgba(79,125,255,0.4)" />
  <rect x="135" y="198" width="75" height="7" rx="4" fill="rgba(79,125,255,0.25)" />
  <rect x="135" y="218" width="85" height="7" rx="4" fill="rgba(79,125,255,0.25)" />
  <rect x="135" y="238" width="70" height="7" rx="4" fill="rgba(79,125,255,0.25)" />
  <rect x="135" y="258" width="80" height="7" rx="4" fill="rgba(79,125,255,0.25)" />
  <rect x="135" y="278" width="65" height="7" rx="4" fill="rgba(79,125,255,0.25)" />
  <rect x="135" y="298" width="88" height="7" rx="4" fill="rgba(79,125,255,0.25)" />

  <!-- Livre secondaire (décalé) -->
  <rect x="260" y="155" width="140" height="240" rx="12" fill="rgba(255,255,255,0.85)" />
  <rect x="256" y="155" width="12" height="240" rx="4" fill="rgba(0,0,0,0.1)" />

  <!-- Lignes texte livre droit -->
  <rect x="285" y="200" width="90" height="8" rx="4" fill="rgba(124,58,237,0.4)" />
  <rect x="285" y="223" width="75" height="7" rx="4" fill="rgba(124,58,237,0.2)" />
  <rect x="285" y="243" width="85" height="7" rx="4" fill="rgba(124,58,237,0.2)" />
  <rect x="285" y="263" width="70" height="7" rx="4" fill="rgba(124,58,237,0.2)" />
  <rect x="285" y="283" width="80" height="7" rx="4" fill="rgba(124,58,237,0.2)" />
  <rect x="285" y="303" width="65" height="7" rx="4" fill="rgba(124,58,237,0.2)" />

  <!-- Étoile badge premium en haut à droite -->
  <circle cx="390" cy="142" r="46" fill="#f59e0b" />
  <circle cx="390" cy="142" r="40" fill="#fbbf24" />
  <!-- Étoile 5 branches -->
  <polygon points="390,108 399,134 427,134 405,151 413,177 390,161 367,177 375,151 353,134 381,134"
    fill="#fff" opacity="0.95" />

  <!-- Trait décoratif bas -->
  <rect x="110" y="395" width="290" height="5" rx="3" fill="rgba(255,255,255,0.2)" />
</svg>
